<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        #game { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 5px; }
        .cell { width: 100px; height: 100px; display: flex; justify-content: center; align-items: center; font-size: 2em; background-color: white; cursor: pointer; }
        .cell:hover { background-color: #e0e0e0; }
        #status { margin-top: 20px; font-size: 1.5em; }
    </style>
</head>
<body>
    <div>
        <div id="game"></div>
        <div id="status"></div>
        <button id="reset">New Game</button>
    </div>
    <script>
        const game = document.getElementById('game');
        const status = document.getElementById('status');
        const resetButton = document.getElementById('reset');
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let isGameActive = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function createBoard() {
            board.forEach((cell, index) => {
                const cellElement = document.createElement('div');
                cellElement.classList.add('cell');
                cellElement.setAttribute('data-index', index);
                cellElement.innerText = cell;
                cellElement.addEventListener('click', handleCellClick);
                game.appendChild(cellElement);
            });
        }

        function handleCellClick(event) {
            const index = event.target.getAttribute('data-index');
            if (board[index] !== '' || !isGameActive) return;
            board[index] = currentPlayer;
            event.target.innerText = currentPlayer;
            checkResult();
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus();
        }

        function checkResult() {
            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] === '' || board[b] === '' || board[c] === '') continue;
                if (board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    break;
                }
            }
            if (roundWon) {
                status.innerText = `Player ${currentPlayer} wins!`;
                isGameActive = false;
                return;
            }
            if (!board.includes('')) {
                status.innerText = 'Draw!';
                isGameActive = false;
            }
        }

        function updateStatus() {
            if (isGameActive) {
                status.innerText = `Player ${currentPlayer}'s turn`;
            }
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            isGameActive = true;
            currentPlayer = 'X';
            status.innerText = `Player ${currentPlayer}'s turn`;
            game.innerHTML = '';
            createBoard();
        }

        resetButton.addEventListener('click', resetGame);
        createBoard();
        updateStatus();
    </script>
</body>
</html>
